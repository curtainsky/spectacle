name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          sw_vers

      - name: Build Spectacle
        run: |
          xcodebuild -project Spectacle.xcodeproj \
                     -target Spectacle \
                     -configuration Release \
                     CODE_SIGNING_ALLOWED=NO \
                     build
